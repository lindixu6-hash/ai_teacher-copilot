<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Teacher Copilot</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#f6f1e8;
      color:#2d2a27;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      max-width:760px;
      width:100%;
      padding:28px;
      border-radius:28px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(45,42,39,.08);
      box-shadow:0 18px 60px rgba(45,42,39,.08);
    }
    .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#6f8077}
    h1{margin:10px 0 8px;font-size:clamp(30px,4vw,48px)}
    p{margin:0 0 18px;color:#6f685f;line-height:1.7}
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 18px;
      border-radius:999px;
      background:#6f8077;
      color:#fff;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">AI Teacher Copilot</div>
    <h1>教师端 AI 备课与出题助手</h1>
    <p>这是产品入口壳，真正的产品页在 `/teacher-copilot-app/`。</p>
    <a href="/teacher-copilot-app/">进入产品页</a>
  </main>
</body>
</html>
